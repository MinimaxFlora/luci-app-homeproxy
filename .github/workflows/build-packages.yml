name: Build and Release HomeProxy

on:
  push:
    branches:
      - 'master'
      - 'dev'
    paths:
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - 'Makefile'
      - '.github/**'
      - '!.github/ISSUE_TEMPLATE/**'
  workflow_dispatch: # 添加手动触发选项

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限，以便自动创建 tag 和 release

    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6

      - name: Extract version from Makefile
        id: version
        run: |
          # 自动从 Makefile 提取 PKG_VERSION 的值 (例如 1.0.1)
          VERSION=$(grep -oP '^PKG_VERSION:=\K.*' Makefile | tr -d '[:space:]')
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "Extracted tag: v$VERSION"

      - name: Checkout apk
        uses: actions/checkout@v6
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

      - name: Checkout po2lmo
        uses: actions/checkout@v6
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          sparse-checkout: 'modules/luci-base/src'

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E rm -rf /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          pushd apk-tools
          meson setup build \
            -Db_lto=true \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=enabled \
            -Dlua_version=5.1 \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=false \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo -E meson install -C build --strip
          popd

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

          curl -fLO "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 ipkg-build /usr/local/bin/ipkg-build

      - name: Build ipk file
        run: |
          pushd .github
          # 强制传入 "release"，让打包脚本读取 Makefile 内的版本号，而不是使用 snapshot
          fakeroot bash build-ipk.sh apk "release"
          fakeroot bash build-ipk.sh ipk "release"
          echo "APK_ASSET_NAME=$(ls *.apk)" >> $GITHUB_ENV
          echo "IPK_ASSET_NAME=$(ls *.ipk)" >> $GITHUB_ENV
          popd

      - name: Publishing APK files to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_ASSET_NAME }}
          path: .github/${{ env.APK_ASSET_NAME }}
          archive: false

      - name: Publishing IPK files to GitHub Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IPK_ASSET_NAME }}
          path: .github/${{ env.IPK_ASSET_NAME }}
          archive: false

      - name: Publishing to GitHub Releases
        uses: svenstaro/upload-release-action@2.11.5
        if: github.ref == 'refs/heads/master' # 仅在 master 分支推送时发布 Release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: .github/luci-app-homeproxy_*.*
          file_glob: true
          tag: ${{ env.TAG_NAME }}
          release_name: Release ${{ env.TAG_NAME }}
          overwrite: true # 如果 tag 已存在，则覆盖原有的 release 附件
